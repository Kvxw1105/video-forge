name: Structured Platform CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q -p no:cacheprovider
      - run: python -m compileall -q backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --check
      - name: Credential scan
        shell: pwsh
        run: |
          $hits = git grep -n -I -E '(Authorization: Bearer [A-Za-z0-9._-]{12,}|fishApiKey.{0,2}:.*[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]+)' -- . ':!backend/tests/**'
          $scanExit = $LASTEXITCODE
          if ($scanExit -gt 1) { throw "credential scan failed" }
          if ($scanExit -eq 0 -and $hits) { Write-Error $hits; exit 1 }
          exit 0
