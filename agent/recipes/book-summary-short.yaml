id: book-summary-short
version: 1
name: Book Summary Short Video
description: Compress a book idea into a short structured narrated video with semantic scenes.
inputContract:
  required:
    - source_notes_or_book_excerpt
  optional:
    - projectId
    - batchSpec
entry_modes:
  - director
required_inputs:
  - source_notes_or_book_excerpt
facts:
  timing_authority: subtitles_or_alignment
  scene_boundary: block
steps:
  - id: inspect_or_create_project
    kind: tool
    tool: inspect_video_project
    auto: true
    required: true
    inputFrom: []
    completionCondition: inspection_available
    retry: safe
    onError: fail
    produces:
      - project_inspection
    allow_missing_project: true
    outputs:
      - project_summary
  - id: select_atomic_point
    kind: inspection
    auto: true
    required: true
    inputFrom:
      - inspect_or_create_project
    completionCondition: atomic_point_selected
    onError: fail
    produces:
      - atomic_point_selection
    outputs:
      - atomic_point_selection
  - id: compress_script
    kind: inspection
    auto: true
    required: true
    inputFrom:
      - select_atomic_point
    completionCondition: compressed_script_ready
    onError: fail
    produces:
      - compressed_script_draft
    outputs:
      - compressed_script_draft
  - id: prepare_structured_script
    kind: tool
    tool: prepare_structured_script
    auto: true
    required: true
    inputFrom:
      - compress_script
    completionCondition: structured_script_ready
    retry: safe
    onError: fail
    produces:
      - structured_episode_proposal
    outputs:
      - structured_episode_proposal
  - id: approve_script
    kind: approval
    policy: script_content_change
    required: true
    inputFrom:
      - prepare_structured_script
    completionCondition: approval_granted
    onError: pause
    reason: User must approve the compressed interpretation before voiceover.
  - id: materialize_audio_and_subtitles
    kind: tool
    tool: create_video_factory_job
    auto: false
    required: true
    inputFrom:
      - approve_script
    completionCondition: factory_created
    onError: recoverable
    approval_required_when:
      - paid_tts
      - paid_llm
    retry: safe
    outputs:
      - batch_ref
      - subtitle_alignment_ref
  - id: plan_scenes
    kind: tool
    tool: review_visual_scene_plan
    auto: true
    required: true
    inputFrom:
      - materialize_audio_and_subtitles
    completionCondition: scene_plan_ready
    retry: safe
    onError: recoverable
    produces:
      - scene_plan_report
    constraints:
      - no_free_start_end
      - no_cross_block_scenes
    outputs:
      - scene_plan_report
  - id: prepare_visuals
    kind: tool
    tool: prepare_visual_generation_pack
    auto: true
    required: true
    inputFrom:
      - plan_scenes
    completionCondition: visual_pack_ready
    retry: safe
    onError: recoverable
    produces:
      - visual_generation_pack
    outputs:
      - visual_generation_pack
  - id: wait_for_assets
    kind: wait
    resume_when: visual_coverage_complete
    required: true
    inputFrom:
      - prepare_visuals
    condition: visual_assets_complete
    completionCondition: coverage_complete
    onError: pause
  - id: bind_assets
    kind: tool
    tool: bind_scene_assets
    auto: true
    required: true
    inputFrom:
      - wait_for_assets
    completionCondition: assets_bound
    retry: idempotent
    onError: recoverable
    produces:
      - visual_binding_report
    outputs:
      - visual_binding_report
  - id: preview
    kind: tool
    tool: build_video_preview
    auto: true
    required: true
    inputFrom:
      - bind_assets
    completionCondition: preview_ready
    onError: recoverable
    retry: safe
    produces:
      - preview_ref
    outputs:
      - preview_ref
  - id: export
    kind: tool
    tool: export_editable_draft
    auto: true
    required: true
    inputFrom:
      - preview
    completionCondition: editable_draft_exported
    retry: idempotent
    onError: recoverable
    mode: create_new
    produces:
      - draft_export_ref
    outputs:
      - draft_export_ref
completion:
  requires:
    - atomic_point_selection
    - structured_episode_proposal
    - preview_ref
    - draft_export_ref
failure_handling:
  source_too_broad: ask_user_to_select_scope
  missing_assets: pause_waiting_assets
  stale_alignment: reinspect_before_scene_plan
